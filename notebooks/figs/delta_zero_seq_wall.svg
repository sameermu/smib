<svg xmlns="http://www.w3.org/2000/svg" width="940" height="300" viewBox="0 0 940 300" font-family="Helvetica, Arial, sans-serif">
  <style>
    .lbl  { font-size:13px; fill:#212121; }
    .ttl  { font-size:14px; font-weight:bold; fill:#212121; }
    .sub  { font-size:12px; fill:#616161; font-style:italic; }
    .wire { stroke:#424242; stroke-width:1.8; fill:none; }
    .open { stroke:#C62828; stroke-width:2.0; fill:none; }
    .box  { fill:#E8F5E9; stroke:#2E7D32; stroke-width:1.5; }
    .gnd  { stroke:#424242; stroke-width:1.8; }
  </style>

  <text x="20" y="24" class="ttl">Zero-sequence network of the SMIB with a &#916;&#8211;Yg GSU (per-phase equivalent)</text>

  <!-- machine side: open circuit -->
  <text x="60" y="64" class="lbl">GENROU stator</text>
  <text x="60" y="80" class="sub">(behind &#916; winding)</text>
  <circle cx="100" cy="120" r="18" fill="none" stroke="#424242" stroke-width="1.8"/>
  <text x="100" y="125" class="lbl" text-anchor="middle">M</text>
  <path class="wire" d="M118,120 L168,120"/>
  <!-- open circuit gap -->
  <path class="open" d="M168,120 L186,104"/>
  <circle cx="168" cy="120" r="3" fill="#C62828"/>
  <circle cx="196" cy="120" r="3" fill="#C62828"/>
  <text x="182" y="92" class="sub" text-anchor="middle">open: &#916; blocks I&#8320;</text>
  <path class="wire" d="M196,120 L256,120"/>

  <!-- delta with circulating current -->
  <polygon points="256,96 296,144 216,144" fill="none" stroke="#424242" stroke-width="1.8"/>
  <text x="256" y="170" class="sub" text-anchor="middle">I&#8320; circulates inside &#916;</text>
  <path d="M256,108 a14,14 0 1 1 -12,8" fill="none" stroke="#EF6C00" stroke-width="1.6" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#EF6C00"/>
    </marker>
  </defs>

  <!-- GSU impedance to HV bus -->
  <path class="wire" d="M296,120 L336,120"/>
  <rect x="336" y="106" width="84" height="28" class="box"/>
  <text x="378" y="124" class="lbl" text-anchor="middle">jX&#8320;,GSU</text>
  <path class="wire" d="M420,120 L488,120"/>

  <!-- HV fault bus -->
  <rect x="488" y="86" width="10" height="68" fill="#212121"/>
  <text x="493" y="76" class="lbl" text-anchor="middle">HV bus (fault bus)</text>

  <!-- ground tie at HV bus through GSU: the Yg winding -->
  <path class="wire" d="M378,134 L378,176 L378,176"/>
  <path class="gnd" d="M362,176 L394,176 M366,182 L390,182 M371,188 L385,188"/>
  <text x="378" y="206" class="sub" text-anchor="middle">Yg neutral &#8594; ground</text>

  <!-- line zero sequence to infinite bus -->
  <path class="wire" d="M498,120 L546,120"/>
  <rect x="546" y="106" width="100" height="28" class="box"/>
  <text x="596" y="124" class="lbl" text-anchor="middle">jX&#8320;,line</text>
  <path class="wire" d="M646,120 L700,120"/>
  <rect x="700" y="86" width="10" height="68" fill="#212121"/>
  <text x="706" y="76" class="lbl" text-anchor="middle">infinite bus (grounded)</text>
  <path class="wire" d="M710,120 L744,120 L744,176"/>
  <path class="gnd" d="M728,176 L760,176 M732,182 L756,182 M737,188 L751,188"/>

  <text x="20" y="250" class="lbl">Looking into the network from the HV fault bus, the zero-sequence Thevenin is</text>
  <text x="20" y="272" class="lbl" font-style="italic">Z&#8320;,th = jX&#8320;,GSU &#8741; jX&#8320;,line &#8212; the machine stator never appears: the &#916; winding is a zero-sequence wall.</text>
</svg>
